# Gateway & Proxy (sección 9): TLS, rate limit, CSP/CORS en el borde. Ajusta dominio y rutas de certificados.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server { listen 80; server_name autostyle.example.com; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name autostyle.example.com;
  ssl_certificate /etc/letsencrypt/live/autostyle.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/autostyle.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  root /var/www/autostyle;                       # salida de `npm run build` del frontend
  location /api/ { limit_req zone=api burst=30 nodelay; proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
